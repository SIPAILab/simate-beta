[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sipai"
authors = [
    {name = "Jinhui Ye", email="jinhuiyes@gmail.com"},
    {name = "Fangjing Wang", email="fangjing_wang@outlook.com"},
    {name = "Junqiu Yu", email="michaelyu1101@163.com"},

]
description = "SiPAI: native Vision-Language-Action memory-policy training."
version = "1.0.1"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["vision-language-actions models", " robotic manipulation", "multimodal pretraining", "robot learning", "generative models"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
]

[project.scripts]
sipai = "tools.train:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "tests",
    "tests.*",
    "cache",
    "cache.*",
    "playground",
    "playground.*",
    "results",
    "results.*",
    "checkpoints",
    "checkpoints.*",
    "scripts",
    "scripts.*",
    "eval",
    "eval.*",
    "assets",
    "assets.*",
    "**bar**",
    "bar.*",
    ".vscode",
    "*.egg-info",
    "**__pycache__**",
    "*.pyc",
    "*.pyo",
    "sipai.egg-info",
    "sipai.egg-info.*",
]

[tool.black]
line-length = 120
target-version = ["py310"]
preview = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
